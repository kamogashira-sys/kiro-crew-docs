name: Release kiro-crew-docs

# 本サイトの GitHub Release（タグ vX.Y.Z とリリース）の作成を Actions が行う。
# 人の承認点は「リリースノートを含む PR のマージ」に一元化する（.github/UPDATE_GUIDE.md §7.3 ⑦・§13 W-17）。
# エージェント（Kiro Web）と人はリリースノート .github/release-notes/vX.Y.Z.md を PR に含めるだけで、
# タグの作成とリリースの公開は行わない。
#
# 契機:
#   - main への push のうち、.github/release-notes/v*.md が変わったもの（このファイル自身・.gitkeep・
#     ほかのファイルだけの変更では起動しない）
#   - workflow_dispatch（入力 version。main でだけ実行できる）
#
# 誤作動の防止:
#   - 最初に同名タグの有無を確認する。タグがあり同名の Release もあれば、タグの作成とリリースの公開をスキップして
#     ::notice:: を出し、exit 0 で終える（マージ後にノートの誤字を直す PR で再起動しても、作り直さず CI も赤くしない）
#   - タグがあり Release が無い場合は、タグを取り直してタグの commit（git rev-parse <タグ>^{commit}）とこの run の
#     commit（github.sha）を比べる。一致すれば（タグの push の後に Release の作成だけが失敗した run の再実行）、
#     タグを作り直さずに Release だけを作成する。一致しなければ過去のタグに Release を自動では作らず、::error:: を
#     出して失敗させる（人が判断する）。Release の有無は gh release view で確かめ、"release not found" 以外の
#     失敗は判定不能として失敗させる
#   - push では、その push で追加・変更されたノートだけを対象にする（既存のノートを一括で対象にしない）。
#     リネームで追加されたノートも対象にするため、差分は --no-renames で取る。
#     差分の起点（github.event.before）が取れない push は対象を決めずに失敗させる
#   - 対象のノート（タグの無いノートと、Release の作成だけを再試行するノート）が2件以上ある push は失敗させる
#     （README の固定版と changelog の先頭の版は1つなので、4者一致を満たすノートは1件だけのため）
#   - タグの作成前のゲート: make check-kiro-crew-ignore・make check-kiro-crew-all・
#     make check-kiro-crew-release-note（4者一致）・上流 kirodotdev/KiroCrew の同名 Release が安定版
#
# 権限: 既定は無し。ゲートのジョブは contents: read、タグ作成とリリース公開のジョブだけ contents: write。
on:
  push:
    branches: [ main ]
    paths:
      - '.github/release-notes/v*.md'
  workflow_dispatch:
    inputs:
      version:
        description: 'リリースする版（vX.Y.Z。.github/release-notes/vX.Y.Z.md が main にあること）'
        required: true
        type: string

permissions: {}

# 同時に2本走らせない（タグの有無の確認と作成の間に別の run が割り込まないようにする）
concurrency:
  group: release-kiro-crew-docs
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.target.outputs.version }}
      note: ${{ steps.target.outputs.note }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # push の差分（before..sha）を取るため全履歴を取る

      - name: 実行ブランチの確認（main のみ）
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Release は main でだけ実行できます（実行ブランチ: ${GITHUB_REF}）"
          exit 1

      # 対象ノートの決定と同名タグの確認（最初に行う）。
      # 出力 version が空なら、後続のゲートとリリースのジョブは実行しない
      - name: 対象リリースノートと同名タグの確認
        id: target
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version_re='^v[0-9]+\.[0-9]+\.[0-9]+$'

          # 同名タグの有無。0=ある、2=無い（git ls-remote --exit-code）。それ以外は判定不能として失敗
          tag_state() {
            local rc=0
            git ls-remote --exit-code --tags origin "refs/tags/$1" >/dev/null || rc=$?
            case "$rc" in
              0) echo exists ;;
              2) echo absent ;;
              *) echo "::error::タグ $1 の有無を確認できません（git ls-remote exit $rc）" >&2; return 1 ;;
            esac
          }

          # 同名 Release の有無。released=ある、missing=無い（gh の "release not found"）。それ以外は判定不能として失敗
          release_state() {
            local err="$RUNNER_TEMP/release-view.err"
            if gh release view "$1" --json tagName >/dev/null 2>"$err" </dev/null; then
              echo released
            elif grep -qx 'release not found' "$err"; then
              echo missing
            else
              echo "::error::Release $1 の有無を確認できません（gh release view: $(head -1 "$err")）" >&2
              return 1
            fi
          }

          # タグが指す commit。タグを origin から取り直してから解決する
          tag_commit() {
            git fetch --quiet --no-tags origin "+refs/tags/$1:refs/tags/$1" </dev/null \
              || { echo "::error::タグ $1 を取得できません" >&2; return 1; }
            git rev-parse "refs/tags/$1^{commit}" \
              || { echo "::error::タグ $1 の commit を解決できません" >&2; return 1; }
          }

          : > "$RUNNER_TEMP/candidates.txt"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if ! [[ "$INPUT_VERSION" =~ $version_re ]]; then
              echo "::error::入力 version は vX.Y.Z の形式で指定してください"
              exit 1
            fi
            printf '%s\n' ".github/release-notes/${INPUT_VERSION}.md" > "$RUNNER_TEMP/candidates.txt"
          else
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
               || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
              echo "::error::push の差分の起点（github.event.before）を取得できないため、対象のノートを決めません"
              exit 1
            fi
            git diff --no-renames --name-only --diff-filter=AM "$BEFORE" "$AFTER" -- '.github/release-notes/v*.md' \
              > "$RUNNER_TEMP/candidates.txt"
          fi
          echo "候補のノート:"; sed 's/^/  /' "$RUNNER_TEMP/candidates.txt"

          pending=()
          while IFS= read -r note; do
            [ -n "$note" ] || continue
            v=$(basename "$note" .md)
            if ! [[ "$v" =~ $version_re ]]; then
              echo "::error::$note のファイル名が vX.Y.Z.md の形式ではありません"
              exit 1
            fi
            state=$(tag_state "$v")
            if [ "$state" = "exists" ]; then
              rstate=$(release_state "$v")
              if [ "$rstate" = "released" ]; then
                echo "::notice::タグ $v と Release $v は既に存在するため、タグの作成とリリースの公開をスキップします"
                continue
              fi
              tc=$(tag_commit "$v")
              if [ "$tc" != "$AFTER" ]; then
                echo "::error::タグ $v はありますが Release がありません。タグの commit（$tc）がこの run の commit（$AFTER）と異なるため、Release を自動では作りません。人が判断してください"
                exit 1
              fi
              echo "::warning::タグ $v はこの run の commit を指していますが Release がありません。Release の作成だけを再試行します"
            fi
            if [ ! -f "$note" ]; then
              echo "::error::$note がありません"
              exit 1
            fi
            pending+=("$note")
          done < "$RUNNER_TEMP/candidates.txt"

          if [ "${#pending[@]}" -eq 0 ]; then
            echo "::notice::タグの作成とリリースの公開の対象はありません"
            echo "version=" >> "$GITHUB_OUTPUT"
            echo "note=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${#pending[@]}" -gt 1 ]; then
            echo "::error::対象のノート（タグの無いノートと Release の作成を再試行するノート）が ${#pending[@]} 件あります（1回に公開できるのは1版です）: ${pending[*]}"
            exit 1
          fi
          note="${pending[0]}"
          echo "対象: $note"
          echo "version=$(basename "$note" .md)" >> "$GITHUB_OUTPUT"
          echo "note=$note" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        if: steps.target.outputs.version != ''
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 公開範囲の機械検証を最初に行う（公開事故は取り返しがつかない）
      - name: ゲート 公開範囲チェック
        if: steps.target.outputs.version != ''
        run: make check-kiro-crew-ignore

      - name: ゲート 全チェック（ネットワーク不要）
        if: steps.target.outputs.version != ''
        run: make check-kiro-crew-all

      - name: ゲート リリースノートの版の4者一致
        if: steps.target.outputs.version != ''
        env:
          NOTE: ${{ steps.target.outputs.note }}
        run: make check-kiro-crew-release-note NOTE="$NOTE"

      # 上流 kirodotdev/KiroCrew の同名 Release が安定版であること（プレリリースを対象にしない。WORKFLOW.md §8）
      - name: ゲート 上流の同名 Release が安定版
        if: steps.target.outputs.version != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.target.outputs.version }}
        run: |
          set -euo pipefail
          pre=$(gh api "repos/kirodotdev/KiroCrew/releases/tags/${V}" --jq '.prerelease')
          echo "kirodotdev/KiroCrew ${V}: prerelease=${pre}"
          if [ "$pre" != "false" ]; then
            echo "::error::上流の ${V} は安定版ではありません（prerelease=${pre}）"
            exit 1
          fi

  release:
    needs: gate
    if: needs.gate.outputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write   # タグの push とリリースの公開に必要

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}   # ゲートを通した commit にタグを打つ

      - name: タグ作成とリリース公開
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          V: ${{ needs.gate.outputs.version }}
          NOTE: ${{ needs.gate.outputs.note }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # 1行目（H1）をタイトル、2行目以降を本文にする
          title=$(head -1 "$NOTE" | sed -E 's/^#[[:space:]]+//')
          tail -n +2 "$NOTE" > "$RUNNER_TEMP/body.md"
          # ゲートの後に同名タグが作られていた場合も、タグを作り直さない
          rc=0
          git ls-remote --exit-code --tags origin "refs/tags/${V}" >/dev/null || rc=$?
          if [ "$rc" -eq 0 ]; then
            if gh release view "$V" --json tagName >/dev/null 2>"$RUNNER_TEMP/release-view.err"; then
              echo "::notice::タグ ${V} と Release ${V} は既に存在するため、タグの作成とリリースの公開をスキップします"
              exit 0
            fi
            if ! grep -qx 'release not found' "$RUNNER_TEMP/release-view.err"; then
              echo "::error::Release ${V} の有無を確認できません（gh release view: $(head -1 "$RUNNER_TEMP/release-view.err")）"
              exit 1
            fi
            # タグを取り直し、タグの commit がこの run の commit と一致する場合だけ Release を作る（run の再実行による回復）
            git fetch --quiet --no-tags origin "+refs/tags/${V}:refs/tags/${V}"
            tag_commit=$(git rev-parse "refs/tags/${V}^{commit}")
            if [ "$tag_commit" != "$SHA" ]; then
              echo "::error::タグ ${V} はありますが Release がありません。タグの commit（${tag_commit}）がこの run の commit（${SHA}）と異なるため、Release を自動では作りません。人が判断してください"
              exit 1
            fi
            gh release create "$V" --verify-tag --latest --title "$title" --notes-file "$RUNNER_TEMP/body.md"
            echo "::notice::タグ ${V} はこの run の commit を指していて Release が無かったため、Release だけを作成しました（${title}）"
            exit 0
          elif [ "$rc" -ne 2 ]; then
            echo "::error::タグ ${V} の有無を確認できません（git ls-remote exit ${rc}）"
            exit 1
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$V" -m "$title" "$SHA"
          git push origin "refs/tags/${V}"
          gh release create "$V" --verify-tag --latest --title "$title" --notes-file "$RUNNER_TEMP/body.md"
          echo "::notice::${V} を公開しました（${title}）"
